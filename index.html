<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asus Clicker - Pro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="tela-jogo">
      <main class="area-clique">
        <header>
          <h1 id="titulo-jogo">Asus Clicker</h1>
          <div class="placar">
            <span id="pontuacao">0</span> <span id="unidade">Pontos</span>
          </div>

          <div class="area-save">
            <input type="text" id="nome-jogador" placeholder="Seu Nome" />
            <button onclick="salvarJogo()">💾 Salvar</button>
            <button onclick="carregarJogo()">💾 Carregar</button>
          </div>
        </header>

        <div id="objeto-clique" onclick="registrarClique(event)">
          <img src="click-image.png" id="imagem-principal" alt="Clique aqui!" />
        </div>
      </main>

      <aside class="area-loja">
        <h2>🛒 Loja de Upgrades</h2>
        <div class="status-automacao">
          <p>Gerando: <span id="pontos-por-segundo">0</span> /s</p>
        </div>

        <div id="lista-upgrades">
          <div class="card-upgrade">
            <h3>🖱️ Mouse Gamer</h3>
            <p>Gera +1 ponto/s</p>
            <button onclick="comprarUpgrade1()" id="btn-upg1">
              Comprar (10)
            </button>
          </div>

          <div class="card-upgrade">
            <h3>⌨️ Teclado Mecânico</h3>
            <p>Gera +5 pontos/s</p>
            <button onclick="comprarUpgrade2()" id="btn-upg2">
              Comprar (100)
            </button>
          </div>

          <div class="card-upgrade">
            <h3>⚡ Placa RTX 4090</h3>
            <p>Gera +50 pontos/s</p>
            <button onclick="comprarUpgrade3()" id="btn-upg3">
              Comprar (2000)
            </button>
          </div>
        </div>
        <div class="area-ranking">
          <h2>🏆 Top 5 do Servidor</h2>
          <ul id="lista-ranking">
            <li>Carregando ranking...</li>
          </ul>
          <button onclick="carregarRanking()" id="btn-atualizar">
            🔄 Atualizar Ranking
          </button>
        </div>
      </aside>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
  </body>
</html>
